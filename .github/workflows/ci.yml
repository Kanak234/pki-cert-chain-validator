name: CI

on:
  push:
    branches: [ master, main, prod-hardening ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-and-test:
    name: Build & Test (Java 21 LTS)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compile and Run Test Suite
        run: mvn clean verify --batch-mode

      - name: Test CLI execution
        run: java -jar target/pki-cert-chain-validator-1.0.0.jar --help

      - name: Build Docker Image
        run: docker build -t pki-cert-chain-validator:test .

      - name: Docker Smoke Test
        run: docker run --rm pki-cert-chain-validator:test --help
